<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Fran Mora, FranMoraCz17">
  <style>
    .name { font: 600 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ECEAF6; }
    .handle { font: 400 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #A5A2C2; }
    .lbl { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #A5A2C2; }
    .box { fill: #19162D; }
    .wire { stroke: #35E0E8; stroke-width: 1.5; fill: none; stroke-dasharray: 6 8; opacity: 0.7; animation: flow 1.8s linear infinite; }
    .pod { fill: #35E0E8; animation: pulse 3.6s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.9s; }
    .d4 { animation-delay: 1.35s; } .d5 { animation-delay: 1.8s; } .d6 { animation-delay: 2.25s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .wire, .pod { animation: none; } }
  </style>

